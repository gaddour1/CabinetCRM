services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: ${CABINET_ENV_FILE:-.env}
    init: true
    entrypoint: ["sh", "/usr/local/bin/cabinet-entrypoint"]
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - cabinet_config.wsgi:application
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/connexion/', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
